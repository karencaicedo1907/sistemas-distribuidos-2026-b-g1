<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img"
     aria-label="Estructura interna de los repositorios: la documentación, la infraestructura y las herramientas de demostración a la izquierda, el servicio en el centro y el portal a la derecha, cada uno con sus directorios reales."
